name: Build and publish clients
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=384
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: videosreeeen-windows
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.blockmap
            artifacts/windows/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: videosreeeen-extension
          path: artifacts/VideoSreeeen-SourceHelper.zip
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=384
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Build with the stable release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$VS_ANDROID_STORE_PASSWORD" || { echo 'Configure the stable Android release signing secrets first'; exit 1; }
          export VS_ANDROID_KEYSTORE="$RUNNER_TEMP/videosreeeen-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$VS_ANDROID_KEYSTORE"
          trap 'rm -f "$VS_ANDROID_KEYSTORE"' EXIT
          gradle -p android :app:assembleRelease :app:lintRelease --no-daemon --max-workers=1 --console=plain
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/android/VideoSreeeen-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: videosreeeen-android
          path: artifacts/android/*.apk
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: videosreeeen-windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: videosreeeen-android
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: videosreeeen-extension
          path: artifacts
      - run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run release:prepare
      - run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
